name: Data integrity
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/data-integrity.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.51.1
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npx --no-install playwright test --config=playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify dependency lock
        run: |
          mkdir -p /tmp/game-compass-lock
          cd /tmp/game-compass-lock
          printf '%s\n' '{"name":"game-compass","version":"0.4.0","private":true,"devDependencies":{"@playwright/test":"1.51.1"}}' > package.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          echo LOCKFILE_BEGIN
          cat package-lock.json
          echo LOCKFILE_END
