name: Data integrity
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test tests/data-integrity.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npx --no-install playwright test --config=playwright.config.cjs
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
